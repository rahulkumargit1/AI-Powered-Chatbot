services:
  - type: web
    name: ai-powered-chatbot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-6
      - key: MAX_TOKENS
        value: "2048"
      - key: DATABASE_URL
        value: sqlite:////data/chatbot.db
    disk:
      name: chatbot-data
      mountPath: /data
      sizeGB: 1
    healthCheckPath: /healthz
